<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Clientes & Descontos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

  <div class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- ==================== TELA 0: LOGIN COM FIREBASE AUTH ==================== -->
    <div id="telaLogin" class="flex flex-col items-center justify-center min-h-[80vh]">
      <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center border-t-4 border-blue-600">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Acesso ao Sistema</h1>
        <p class="text-sm text-gray-500 mb-6">Entre com seu e-mail e senha cadastrados.</p>
        
        <div class="space-y-4 mb-6">
          <div>
            <input type="email" id="loginEmail" placeholder="Seu e-mail..." class="w-full border rounded p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
          </div>
          <div>
            <input type="password" id="loginSenha" placeholder="Sua senha..." class="w-full border rounded p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
          </div>
        </div>

        <button onclick="fazerLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded shadow">
          🔑 Entrar no Sistema
        </button>
      </div>
    </div>

    <!-- ==================== TELA 1: LISTA E BUSCA DE CLIENTES ==================== -->
    <div id="telaClientes" class="space-y-6 hidden">
      <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-lg shadow gap-4">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Carteira de Clientes</h1>
          <p class="text-sm text-gray-500">Perfil ativo: <span id="nomePerfilAtivo" class="font-bold text-blue-600">-</span></p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button onclick="sairSistema()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-4 py-2 rounded text-sm">
            Sair / Trocar Perfil
          </button>
          <button id="btnBackup" onclick="fazerBackup()" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-4 py-2 rounded text-sm flex items-center gap-1" style="display: none;">
            📥 Backup JSON
          </button>
          <button id="btnNovoCliente" onclick="abrirModalCliente()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded text-sm flex items-center gap-1" style="display: none;">
            ➕ Novo Cliente
          </button>
        </div>
      </header>

      <div class="bg-white p-4 rounded-lg shadow flex gap-2 items-center">
        <input type="text" id="campoBusca" onkeyup="filtrarClientes()" placeholder="Pesquisar por código, razão social ou CNPJ..." class="border rounded p-2 text-sm flex-1 outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full border-collapse text-left">
          <thead>
            <tr class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider">
              <th class="p-3 w-28">Código</th>
              <th class="p-3">Razão Social / Fantasia</th>
              <th class="p-3 w-40">Consultor</th>
              <th class="p-3 text-center w-40">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaClientesCorpo"></tbody>
        </table>
      </div>
    </div>

    <!-- ==================== TELA 2: TABELA DE DESCONTOS DO CLIENTE ==================== -->
    <div id="telaDescontos" class="space-y-6 hidden">
      <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-lg shadow gap-4">
        <div>
          <button onclick="voltarParaClientes()" class="text-sm text-blue-600 hover:underline font-semibold mb-2 inline-block">
            ← Voltar para Lista de Clientes
          </button>
          <div class="flex items-baseline gap-3">
            <h2 id="detalheCodigo" class="text-xl font-bold text-gray-800">-</h2>
            <h1 id="detalheRazao" class="text-2xl font-extrabold text-gray-900">-</h1>
            <span id="detalheFantasia" class="text-sm text-gray-500"></span>
          </div>
          <div class="flex gap-4 mt-1 text-sm text-gray-600">
            <span id="detalheCnpj">CNPJ: -</span>
            <span id="detalheConsultor" class="font-semibold text-blue-600">Consultor: -</span>
          </div>
        </div>

        <div class="no-print flex gap-2 flex-wrap">
          <input type="file" id="inputExcel" accept=".xlsx, .xls" class="hidden" onchange="processarExcel(event)" />
          
          <button id="btnImportarExcel" onclick="document.getElementById('inputExcel').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-semibold flex items-center gap-1" style="display: none;">
            ⬆ Importar Excel
          </button>

          <button id="btnExcluirTodos" onclick="excluirTodosProdutos()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm font-semibold flex items-center gap-1" style="display: none;">
            🗑️ Excluir Todos
          </button>

          <button onclick="window.print()" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded text-sm font-semibold flex items-center gap-1">
            🖨️ Imprimir / PDF
          </button>
        </div>
      </header>

      <!-- Formulário para Adicionar Produto -->
      <div class="bg-white p-4 rounded-lg shadow flex flex-col md:flex-row gap-2 items-center no-print">
        <input type="text" id="prodNome" placeholder="Produto / Referência (Ex: Cód 12345)" class="border rounded p-2 text-sm flex-1 outline-none focus:ring-2 focus:ring-blue-500 w-full" />
        
        <div class="w-full md:w-44 flex flex-col">
          <span id="labelInputCol1" class="text-[10px] font-bold text-gray-500 mb-0.5">Coluna 1:</span>
          <input type="number" step="0.01" id="prodDesconto" placeholder="0%" class="border rounded p-2 text-sm text-right outline-none focus:ring-2 focus:ring-blue-500 w-full" />
        </div>

        <div class="w-full md:w-44 flex flex-col">
          <span id="labelInputCol2" class="text-[10px] font-bold text-gray-500 mb-0.5">Coluna 2:</span>
          <input type="number" step="0.01" id="prodDescontoVista" placeholder="0%" class="border rounded p-2 text-sm text-right outline-none focus:ring-2 focus:ring-blue-500 w-full" />
        </div>

        <button onclick="adicionarProduto()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold w-full md:w-auto self-end">
          + Sugerir
        </button>
      </div>

      <!-- Tabela de Descontos -->
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full border-collapse border border-gray-200">
          <thead>
            <tr class="bg-gray-100 text-gray-700 text-sm">
              <th class="border border-gray-200 p-2 text-left">Produto</th>
              <th id="thColuna1" class="border border-gray-200 p-2 text-right w-44">Desconto 1 (%)</th>
              <th id="thColuna2" class="border border-gray-200 p-2 text-right w-44">Desconto 2 (%)</th>
              <th class="border border-gray-200 p-2 text-center w-36">Status / Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaDescontosCorpo"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- ==================== MODAL DE CADASTRO/EDIÇÃO DE CLIENTE ==================== -->
  <div id="modalCliente" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6">
      <h3 id="modalTitulo" class="text-xl font-bold text-gray-900 mb-4">Cadastrar Novo Cliente</h3>
      
      <form id="formCliente" onsubmit="salvarCliente(event)" class="space-y-4">
        <input type="hidden" id="cliId" />
        
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Código do Cliente</label>
          <input type="text" id="cliCodigo" required placeholder="Ex: 004209" class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Consultor Responsável</label>
          <select id="cliConsultor" class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="Consultor 1">Consultor 1</option>
            <option value="Consultor 2">Consultor 2</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Razão Social</label>
          <input type="text" id="cliRazao" required placeholder="Nome da empresa..." class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Nome Fantasia (Opcional)</label>
          <input type="text" id="cliFantasia" placeholder="Nome comercial..." class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">CNPJ (Opcional)</label>
          <input type="text" id="cliCnpj" placeholder="00.000.000/0001-00" class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Nome Coluna 1 (%)</label>
            <input type="text" id="cliColuna1" value="Desc. Prazo (%)" placeholder="Ex: Acima de R$ 1k" class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Nome Coluna 2 (%)</label>
            <input type="text" id="cliColuna2" value="Desc. Vista (%)" placeholder="Ex: Abaixo de R$ 1k" class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-4">
          <button type="button" onclick="fecharModalCliente()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded text-sm font-semibold">
            Cancelar
          </button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold">
            Salvar Cliente
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
